name: astrbot_plugin_cyber_divination_cards
display_name: 赛博占卜 · 多主题卡片
short_desc: 十二种占卜玩法，支持关键词触发、HTML 卡片与自定义 AI 绘图。
desc: 赛博占卜插件：周易六爻（含六神）、观音灵签、塔罗牌（单张/三张牌阵与查牌）、奇门遁甲（简式时家排盘，不填时间自动检测当前时刻）、每日运势（按日期固定），以及小六壬、梅花易数、雷诺曼、大六壬、太乙神数、八字与紫微斗数。提供 /占卜 历史 查看记录，支持无前缀关键词匹配、多主题 HTML 卡片、自定义绘图 API 和可选 LLM 润色。
